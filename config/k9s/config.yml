k9s:
  liveViewAutoRefresh: false
  refreshRate: 2
  maxConnRetry: 5
  enableMouse: false
  enableImageScan: false
  headless: false
  logoless: false
  crumbsless: false
  readOnly: false
  noExitOnCtrlC: false
  noIcons: false
  shellPod:
    image: busybox:1.35.0
    namespace: default
    limits:
      cpu: 100m
      memory: 100Mi
  skipLatestRevCheck: false
  logger:
    tail: 100
    buffer: 5000
    sinceSeconds: -1
    fullScreenLogs: false
    textWrap: false
    showTime: false
  currentContext: arn:aws:eks:eu-west-1:004997773360:cluster/burp-eks
  currentCluster: arn:aws:eks:eu-west-1:004997773360:cluster/burp-eks
  keepMissingClusters: false
  clusters:
    arn:aws:eks:eu-west-1:004997773360:cluster/burp-eks:
      namespace:
        active: default
        lockFavorites: false
        favorites:
        - cluster-autoscaler
        - kube-system
        - burp
        - all
        - default
      view:
        active: node
      featureGates:
        nodeShell: false
      portForwardAddress: localhost
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70
  screenDumpDir: /tmp/k9s-screens-sindri
  disablePodCounting: false
