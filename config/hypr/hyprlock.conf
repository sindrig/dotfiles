# Hyprlock configuration
# Matching swaylock setup from sway/definitions

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Background - lockscreen image, black fallback
background {
    monitor =
    path = $HOME/.config/lockscreen/lock.jpg
    color = rgb(0, 0, 0)
}

# Password input field
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3

    outer_color = rgb(255, 255, 255)
    inner_color = rgb(255, 0, 0)
    font_color = rgb(255, 255, 255)

    check_color = rgb(255, 165, 0)
    fail_color = rgb(200, 0, 0)
    capslock_color = rgb(255, 255, 0)

    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false

    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true

    position = 0, -50
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 64
    font_family = Sans

    shadow_passes = 1
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_boost = 0.5

    position = 0, 200
    halign = center
    valign = center
}

# Keyboard layout indicator (matching swaylock -k flag)
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = Sans

    position = 0, -120
    halign = center
    valign = center
}
